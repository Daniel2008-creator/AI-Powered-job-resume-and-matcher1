services:
  - type: web
    name: daniel2008-job-resume-matcher-api
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: TALENTLENS_AUTH_DB
        value: /var/data/talentlens.db
      - key: TALENTLENS_FRONTEND_ORIGIN
        value: https://daniel2008-job-resume-matcher-web.onrender.com
    disk:
      name: talentlens-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: daniel2008-job-resume-matcher-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: daniel2008-job-resume-matcher-api
          envVarKey: RENDER_EXTERNAL_URL