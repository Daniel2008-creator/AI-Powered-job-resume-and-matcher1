services:
  - type: web
    name: daniel2008-job-resume-matcher-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: TALENTLENS_FRONTEND_ORIGIN
        value: https://daniel2008-job-resume-matcher-web.onrender.com

  - type: web
    name: daniel2008-job-resume-matcher-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: daniel2008-job-resume-matcher-api
          envVarKey: RENDER_EXTERNAL_URL